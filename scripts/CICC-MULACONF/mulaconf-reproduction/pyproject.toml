[project]
name = "mulaconf-reproduction"
version = "0.1.0"
description = "Powerset and tree-structured multi-label conformal baselines for WWW 2027 intent experiments"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
