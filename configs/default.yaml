# 全局配置
seed: 42
n_runs: 3
alpha: 0.1  # 目标覆盖率 1-alpha

data:
  datasets:
    - clinc150
    - mixatis
    - mixsnips
  calibration_ratio: 0.25  # 从 train 切 25% 作 calibration
  oos_heldout_intents: 15  # CLINC150 留 15 个意图作 OOS
  max_examples_per_intent: 10  # 知识库每意图示例上限

retriever:
  embed_model: BAAI/bge-large-en-v1.5
  top_k_r: 5  # 检索候选数（消融 {1,3,5,10}）；评估时按 k_r_use 截断

llm:
  model: qwen2.5-72b-instruct
  temperature: 0.0
  max_tokens: 256
  prompt_template: default

conformal:
  alpha: 0.1  # 目标覆盖率 1-alpha
  fusion_alpha: 0.1  # 融合权重，可消融 {0.0,0.1,0.2,0.5}
  tau_aux: 0.5  # 次意图 Jaccard 阈值，可消融 {0.5,0.75,1.0}
  k_max: 1  # 澄清集最大大小（消融确定：K=1 在多意图上最优）
  k_r_use: 1  # 评估时检索候选截断数（消融确定：K_r=1 最紧致）
  oos_fpr: 0.05  # OOS gate 的 FPR95 标定

eval:
  seeds: [42, 123, 2024]
  mcnemar: true
