<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<meta name="description" content="F8 OOS ROC + F7 coverage 校准图">
<title>F7/F8 核心图</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; padding: 14px; background: #fff; color: #1F2329; }
  .title { font-size: 15px; font-weight: 700; color: #1A2B4A; margin: 0 0 4px 0; }
  .subtitle { font-size: 11px; color: #8F959E; margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chart { border: 1px solid #E5E8EC; border-radius: 6px; padding: 6px; }
  .chart h4 { font-size: 12px; font-weight: 600; margin: 4px 0 0 6px; color: #1A2B4A; }
  .chart h4 span { color: #C0392B; }
  .box { width: 100%; height: 300px; }
</style>
</head>
<body>
<div class="title">WWW 2027 选题 A — 共形核心图（F7 / F8）</div>
<div class="subtitle">纯本地零 API 产出；F8 = CLINC150 OOS ROC（检索相似度信号），F7 = CLINC150 empirical coverage vs nominal coverage（split CP guarantee 验证）</div>
<div class="grid">

  <div class="chart">
    <h4>(m) <span>F8</span> OOS ROC — 检索相似度信号（CLINC150）</h4>
    <div id="g7" class="box"></div>
  </div>

  <div class="chart">
    <h4>(n) <span>F7</span> Coverage 校准：empirical vs nominal（CLINC150）</h4>
    <div id="g8" class="box"></div>
  </div>

</div>

<script>
const C = { ours:'#C0392B', blue:'#3B6FB6', gray:'#B0B6BD' };

// F8 ROC data (retrieval only, subsampled for clarity)
const fpr = [0,0.001,0.002,0.004,0.006,0.008,0.010,0.015,0.020,0.030,0.040,0.050,0.070,0.100,0.150,0.200,0.300,0.500,0.736,1.0];
const tpr = [0,0.238,0.256,0.323,0.377,0.416,0.435,0.501,0.540,0.600,0.635,0.666,0.715,0.761,0.817,0.855,0.905,0.955,0.990,1.0];

echarts.init(document.getElementById('g7')).setOption({
  tooltip:{trigger:'axis'},
  legend:{bottom:0, textStyle:{fontSize:10}},
  grid:{left:46, right:20, top:24, bottom:42},
  xAxis:{type:'value', name:'FPR (OOS 误报率)', min:0, max:1, axisLabel:{fontSize:10}, nameTextStyle:{fontSize:10}},
  yAxis:{type:'value', name:'TPR (OOS 拒识率)', min:0, max:1, axisLabel:{fontSize:10}, nameTextStyle:{fontSize:10}},
  series:[
    {name:'Random', type:'line', data:[[0,0],[1,1]], lineStyle:{color:C.gray, type:'dashed', width:1.5}, symbol:'none'},
    {name:'Ours (retrieval fused, AUROC=0.975)', type:'line',
     data:fpr.map((f,i)=>[f,tpr[i]]),
     itemStyle:{color:C.ours}, lineStyle:{width:2.5}, symbol:'circle', symbolSize:5,
     areaStyle:{color:C.ours, opacity:0.08}}
  ]
});

// F7 coverage calibration (CLINC150)
echarts.init(document.getElementById('g8')).setOption({
  tooltip:{trigger:'axis'},
  legend:{bottom:0, textStyle:{fontSize:10}},
  grid:{left:46, right:20, top:24, bottom:42},
  xAxis:{type:'value', name:'Nominal coverage (1-α)', min:0.7, max:1.0, axisLabel:{fontSize:10}, nameTextStyle:{fontSize:10}},
  yAxis:{type:'value', name:'Empirical coverage', min:0.7, max:1.0, axisLabel:{fontSize:10}, nameTextStyle:{fontSize:10}},
  series:[
    {name:'Ideal (y=x)', type:'line', data:[[0.7,0.7],[1.0,1.0]], lineStyle:{color:C.gray, type:'dashed', width:1.5}, symbol:'none'},
    {name:'Ours (CLINC150, k_max=1)', type:'line',
     data:[[0.95,0.951],[0.90,0.892],[0.85,0.892],[0.80,0.892],[0.75,0.892]],
     itemStyle:{color:C.ours}, lineStyle:{width:2.5}, symbol:'circle', symbolSize:9,
     label:{show:true, fontSize:9, color:C.ours, formatter:p=>p.value[1].toFixed(3)}}
  ]
});
</script>
</body>
</html>
