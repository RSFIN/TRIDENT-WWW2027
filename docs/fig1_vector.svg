<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1240" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <!-- ============ DEFS ============ -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A7FB5"/>
    </marker>
    <style>
      .title { font-size: 38px; font-weight: 700; fill: #1a1a1a; }
      .subtitle { font-size: 22px; font-weight: 700; fill: #1a1a1a; }
      .hdr { font-size: 24px; font-weight: 700; }
      .body { font-size: 17px; fill: #222; }
      .small { font-size: 14px; fill: #444; }
      .tiny { font-size: 12px; fill: #666; }
      .eq { font-size: 20px; font-style: italic; }
    </style>
  </defs>

  <!-- ============ TITLE ============ -->
  <text x="900" y="48" text-anchor="middle" class="title">Training-Free Framework for Single-Turn Web Intent Understanding</text>
  <text x="900" y="92" text-anchor="middle" class="title">with Retrieval-Augmented Reasoning and Calibrated Refusal</text>

  <!-- ============ TOP ROW: INPUT + KB ============ -->
  <!-- INPUT box -->
  <rect x="30" y="120" width="520" height="280" rx="14" fill="#EAF1FA" stroke="#4A7FB5" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="55" y="155" class="hdr" fill="#1F4E8C">INPUT: a single-turn user query q</text>
  <text x="55" y="182" class="body">(context-sparse, web search / IM)</text>
  <!-- robot sketch -->
  <g transform="translate(70,200)">
    <circle cx="45" cy="45" r="38" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="15" y="35" width="60" height="22" rx="6" fill="#9ec5e8" stroke="#333"/>
    <circle cx="32" cy="46" r="4" fill="#333"/>
    <circle cx="58" cy="46" r="4" fill="#333"/>
    <line x1="45" y1="7" x2="45" y2="20" stroke="#333" stroke-width="2"/>
    <circle cx="45" cy="5" r="4" fill="#E08E0B"/>
  </g>
  <!-- q bubble -->
  <rect x="180" y="210" width="330" height="150" rx="10" fill="#fff" stroke="#888" stroke-width="1.5"/>
  <text x="200" y="240" class="body"><tspan font-style="italic">q</tspan> (example)</text>
  <text x="200" y="272" class="body">"How do I change my</text>
  <text x="200" y="298" class="body">email password on</text>
  <text x="200" y="324" class="body">Gmail?"</text>

  <!-- KB box -->
  <rect x="580" y="120" width="1190" height="280" rx="14" fill="#EAF1FA" stroke="#4A7FB5" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1175" y="155" text-anchor="middle" class="hdr" fill="#1F4E8C">External Intent Knowledge Base (KB, zero-annotation, updatable at inference)</text>

  <!-- KB left: prototypes -->
  <rect x="610" y="180" width="540" height="200" rx="10" fill="#fff" stroke="#888"/>
  <text x="880" y="208" text-anchor="middle" class="body" font-weight="700">Intent Prototypes (centroid embeddings)</text>
  <!-- folder icons row -->
  <g transform="translate(635,225)">
    <rect x="0" y="10" width="55" height="40" rx="4" fill="#F5C84E" stroke="#333"/>
    <text x="27" y="75" text-anchor="middle" class="small">Change</text>
    <text x="27" y="92" text-anchor="middle" class="small">Password</text>
  </g>
  <g transform="translate(730,225)">
    <rect x="0" y="10" width="55" height="40" rx="4" fill="#8FC98F" stroke="#333"/>
    <text x="27" y="75" text-anchor="middle" class="small">Account</text>
    <text x="27" y="92" text-anchor="middle" class="small">Settings</text>
  </g>
  <g transform="translate(825,225)">
    <rect x="0" y="10" width="55" height="40" rx="4" fill="#7FA8D9" stroke="#333"/>
    <text x="27" y="75" text-anchor="middle" class="small">Payment</text>
    <text x="27" y="92" text-anchor="middle" class="small">Issue</text>
  </g>
  <text x="930" y="260" class="body" font-weight="700">···</text>
  <g transform="translate(970,225)">
    <rect x="0" y="10" width="55" height="40" rx="4" fill="#B89FD9" stroke="#333"/>
    <text x="27" y="75" text-anchor="middle" class="small">Other</text>
    <text x="27" y="92" text-anchor="middle" class="small">Intents</text>
  </g>

  <!-- KB right: utterance vectors -->
  <rect x="1170" y="180" width="580" height="200" rx="10" fill="#fff" stroke="#888"/>
  <text x="1460" y="208" text-anchor="middle" class="body" font-weight="700">Utterance Vectors (examples per intent)</text>
  <!-- row 1 -->
  <text x="1190" y="240" class="small">"How to reset my Gmail password?"</text>
  <g transform="translate(1430,228)">
    <rect x="0" y="0" width="14" height="14" fill="#F5C84E"/><rect x="16" y="0" width="14" height="14" fill="#F5C84E"/><rect x="32" y="0" width="14" height="14" fill="#F5C84E"/><rect x="48" y="0" width="14" height="14" fill="#F5C84E"/><rect x="64" y="0" width="14" height="14" fill="#F5C84E"/>
  </g>
  <text x="1580" y="240" class="small">Change Password</text>
  <!-- row 2 -->
  <text x="1190" y="278" class="small">"I forgot my email login, help!"</text>
  <g transform="translate(1430,266)">
    <rect x="0" y="0" width="14" height="14" fill="#8FC98F"/><rect x="16" y="0" width="14" height="14" fill="#8FC98F"/><rect x="32" y="0" width="14" height="14" fill="#8FC98F"/><rect x="48" y="0" width="14" height="14" fill="#8FC98F"/><rect x="64" y="0" width="14" height="14" fill="#8FC98F"/>
  </g>
  <text x="1580" y="278" class="small">Change Password</text>
  <!-- row 3 -->
  <text x="1190" y="316" class="small">"Update my recovery email."</text>
  <g transform="translate(1430,304)">
    <rect x="0" y="0" width="14" height="14" fill="#8FC98F"/><rect x="16" y="0" width="14" height="14" fill="#8FC98F"/><rect x="32" y="0" width="14" height="14" fill="#8FC98F"/><rect x="48" y="0" width="14" height="14" fill="#8FC98F"/><rect x="64" y="0" width="14" height="14" fill="#8FC98F"/>
  </g>
  <text x="1580" y="316" class="small">Account Settings</text>
  <text x="1460" y="360" text-anchor="middle" class="body" font-weight="700">···</text>

  <!-- arrow from INPUT to KB -->
  <line x1="550" y1="260" x2="580" y2="260" stroke="#4A7FB5" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ============ MIDDLE ROW: 3 MODULES ============ -->
  <!-- Module 1: Retrieval & Reasoning -->
  <rect x="30" y="420" width="560" height="520" rx="14" fill="#F3EEF8" stroke="#7B5EA7" stroke-width="2"/>
  <text x="310" y="455" text-anchor="middle" class="hdr" fill="#5B3E8A">Module 1: Retrieval &amp; Reasoning</text>

  <!-- 1) Top-K retrieval -->
  <rect x="55" y="475" width="510" height="170" rx="10" fill="#fff" stroke="#7B5EA7"/>
  <text x="70" y="500" class="body" font-weight="700">1) Top-K intent retrieval from KB</text>
  <g transform="translate(80,515)">
    <rect x="0" y="10" width="55" height="40" rx="4" fill="#F5C84E" stroke="#333"/>
    <text x="27" y="75" text-anchor="middle" class="small">Change</text>
    <text x="27" y="92" text-anchor="middle" class="small">Password</text>
    <text x="27" y="112" text-anchor="middle" class="body" font-weight="700">0.92</text>
  </g>
  <g transform="translate(180,515)">
    <rect x="0" y="10" width="55" height="40" rx="4" fill="#8FC98F" stroke="#333"/>
    <text x="27" y="75" text-anchor="middle" class="small">Account</text>
    <text x="27" y="92" text-anchor="middle" class="small">Settings</text>
    <text x="27" y="112" text-anchor="middle" class="body" font-weight="700">0.64</text>
  </g>
  <g transform="translate(280,515)">
    <rect x="0" y="10" width="55" height="40" rx="4" fill="#7FA8D9" stroke="#333"/>
    <text x="27" y="75" text-anchor="middle" class="small">Payment</text>
    <text x="27" y="92" text-anchor="middle" class="small">Issue</text>
    <text x="27" y="112" text-anchor="middle" class="body" font-weight="700">0.41</text>
  </g>
  <text x="380" y="560" class="body" font-weight="700">···</text>
  <text x="490" y="580" text-anchor="middle" class="small">Top-K</text>
  <text x="490" y="600" text-anchor="middle" class="small">(e.g., K=10)</text>

  <!-- arrow down -->
  <line x1="310" y1="645" x2="310" y2="665" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2) LLM reasoning -->
  <rect x="55" y="670" width="510" height="210" rx="10" fill="#fff" stroke="#7B5EA7"/>
  <text x="70" y="695" class="body" font-weight="700">2) LLM self-assessed reasoning &amp; confidence</text>
  <!-- table header -->
  <text x="200" y="725" class="small" font-weight="700">Candidate intents (by rank)</text>
  <text x="490" y="725" class="small" font-weight="700">Conf_LLM</text>
  <line x1="180" y1="733" x2="545" y2="733" stroke="#888"/>
  <text x="200" y="760" class="small">1. Change Password (primary)</text>
  <text x="500" y="760" class="small" fill="#2E7D32" font-weight="700">0.86</text>
  <text x="200" y="790" class="small">2. Account Settings (secondary)</text>
  <text x="500" y="790" class="small" fill="#3B6FB6" font-weight="700">0.42</text>
  <text x="200" y="820" class="small">3. Payment Issue</text>
  <text x="500" y="820" class="small" fill="#C0392B" font-weight="700">0.17</text>
  <text x="365" y="855" text-anchor="middle" class="body" font-weight="700">···</text>

  <!-- output strip -->
  <rect x="55" y="890" width="510" height="40" rx="8" fill="#E8E0F0" stroke="#7B5EA7"/>
  <text x="310" y="915" text-anchor="middle" class="small">Outputs: candidate intents with self-assessed confidence Conf_LLM (primary, secondary)</text>

  <!-- Module 2: Conformal Calibration -->
  <rect x="610" y="420" width="580" height="520" rx="14" fill="#EAF5EE" stroke="#3D8B5E" stroke-width="2"/>
  <text x="900" y="455" text-anchor="middle" class="hdr" fill="#2D6B46">Module 2: Set-Valued Conformal Calibration</text>

  <!-- 1) rank-normalized fusion -->
  <rect x="635" y="475" width="530" height="180" rx="10" fill="#fff" stroke="#3D8B5E"/>
  <text x="650" y="500" class="body" font-weight="700">1) Rank-normalized score fusion</text>
  <text x="900" y="530" text-anchor="middle" class="eq">s(q) = g( stats_ret ,  Conf_LLM )</text>
  <!-- four mini stats -->
  <g transform="translate(655,550)">
    <rect x="0" y="0" width="120" height="85" rx="6" fill="#F8FBF8" stroke="#3D8B5E"/>
    <circle cx="60" cy="28" r="10" fill="none" stroke="#3D8B5E" stroke-width="2"/>
    <circle cx="60" cy="28" r="4" fill="#3D8B5E"/>
    <text x="60" y="60" text-anchor="middle" class="tiny">Top-K similarity</text>
  </g>
  <g transform="translate(785,550)">
    <rect x="0" y="0" width="120" height="85" rx="6" fill="#F8FBF8" stroke="#3D8B5E"/>
    <polyline points="20,55 40,40 60,45 80,25 100,30" fill="none" stroke="#3D8B5E" stroke-width="2"/>
    <text x="60" y="72" text-anchor="middle" class="tiny">Margin (top1-top2)</text>
  </g>
  <g transform="translate(915,550)">
    <rect x="0" y="0" width="120" height="85" rx="6" fill="#F8FBF8" stroke="#3D8B5E"/>
    <line x1="30" y1="20" x2="90" y2="20" stroke="#3D8B5E" stroke-width="2"/>
    <line x1="30" y1="20" x2="30" y2="40" stroke="#3D8B5E" stroke-width="2"/>
    <line x1="90" y1="20" x2="90" y2="40" stroke="#3D8B5E" stroke-width="2"/>
    <text x="60" y="65" text-anchor="middle" class="tiny">Distance (min dist.)</text>
  </g>
  <g transform="translate(1045,550)">
    <rect x="0" y="0" width="110" height="85" rx="6" fill="#F8FBF8" stroke="#3D8B5E"/>
    <path d="M55,15 L85,25 L85,45 Q85,65 55,72 Q25,65 25,45 L25,25 Z" fill="none" stroke="#3D8B5E" stroke-width="2"/>
    <text x="55" y="85" text-anchor="middle" class="tiny">Conf (LLM/top1)</text>
  </g>

  <!-- arrow down -->
  <line x1="900" y1="655" x2="900" y2="675" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2) split conformal -->
  <rect x="635" y="680" width="530" height="140" rx="10" fill="#fff" stroke="#3D8B5E"/>
  <text x="650" y="705" class="body" font-weight="700">2) Split conformal calibration (no gradients)</text>
  <!-- calibration split icon -->
  <g transform="translate(660,720)">
    <ellipse cx="25" cy="10" rx="25" ry="8" fill="#9ec5e8" stroke="#333"/>
    <rect x="0" y="10" width="50" height="30" fill="#9ec5e8" stroke="#333"/>
    <ellipse cx="25" cy="40" rx="25" ry="8" fill="#7FA8D9" stroke="#333"/>
    <text x="25" y="65" text-anchor="middle" class="tiny">Calibration</text>
    <text x="25" y="80" text-anchor="middle" class="tiny">Split (held-out)</text>
  </g>
  <line x1="735" y1="760" x2="785" y2="760" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- histogram -->
  <g transform="translate(795,720)">
    <rect x="0" y="30" width="14" height="40" fill="#9ec5e8"/>
    <rect x="18" y="15" width="14" height="55" fill="#9ec5e8"/>
    <rect x="36" y="5" width="14" height="65" fill="#9ec5e8"/>
    <rect x="54" y="25" width="14" height="45" fill="#9ec5e8"/>
    <rect x="72" y="45" width="14" height="25" fill="#9ec5e8"/>
    <line x1="95" y1="0" x2="95" y2="75" stroke="#C0392B" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="100" y="15" class="tiny" fill="#C0392B">τ_cal</text>
    <text x="45" y="95" text-anchor="middle" class="tiny">Nonconformity score s(q)</text>
  </g>
  <line x1="915" y1="760" x2="960" y2="760" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- target / coverage -->
  <g transform="translate(975,720)">
    <circle cx="35" cy="35" r="30" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
    <circle cx="35" cy="35" r="18" fill="#fff" stroke="#C0392B" stroke-width="2"/>
    <circle cx="35" cy="35" r="6" fill="#C0392B"/>
    <line x1="35" y1="0" x2="35" y2="70" stroke="#C0392B" stroke-width="1"/>
    <text x="35" y="95" text-anchor="middle" class="tiny">Finite-sample coverage</text>
    <text x="35" y="112" text-anchor="middle" class="tiny">1 − α = 0.90</text>
  </g>

  <!-- 3) guarantees -->
  <rect x="635" y="835" width="530" height="95" rx="10" fill="#fff" stroke="#3D8B5E"/>
  <text x="650" y="860" class="body" font-weight="700">3) Theoretical guarantees</text>
  <text x="660" y="885" class="small">Marginal coverage: Pr(Y ∈ Ŝ(q)) ≥ 1−α = 0.90</text>
  <text x="660" y="908" class="small">Set-level Jaccard risk ≤ ε_J (finite-sample bound)</text>
  <text x="660" y="928" class="small">No gradient training, no classifier head</text>

  <!-- Module 3: Three-State Decision -->
  <rect x="1210" y="420" width="560" height="520" rx="14" fill="#F3EEF8" stroke="#7B5EA7" stroke-width="2"/>
  <text x="1490" y="455" text-anchor="middle" class="hdr" fill="#5B3E8A">Module 3: Adaptive Three-State Decision</text>

  <!-- threshold axis -->
  <rect x="1235" y="475" width="510" height="130" rx="10" fill="#fff" stroke="#7B5EA7"/>
  <text x="1490" y="498" text-anchor="middle" class="small" font-weight="700">Thresholds calibrated at FPR95</text>
  <text x="1260" y="528" class="tiny">Low Risk</text>
  <text x="1720" y="528" text-anchor="end" class="tiny">High Risk</text>
  <!-- axis -->
  <line x1="1280" y1="550" x2="1700" y2="550" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="1340" cy="550" r="8" fill="#2E7D32"/>
  <circle cx="1500" cy="550" r="3" fill="#333"/>
  <circle cx="1620" cy="550" r="8" fill="#C0392B"/>
  <text x="1280" y="578" class="tiny">−∞</text>
  <text x="1340" y="578" text-anchor="middle" class="tiny">τ_lo</text>
  <text x="1500" y="578" text-anchor="middle" class="tiny">s(q)</text>
  <text x="1620" y="578" text-anchor="middle" class="tiny">τ_hi</text>
  <text x="1700" y="578" text-anchor="end" class="tiny">+∞</text>

  <!-- RELEASE -->
  <rect x="1235" y="620" width="510" height="90" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="1260" y="655" class="body" fill="#2E7D32" font-weight="700">RELEASE</text>
  <text x="1260" y="685" class="small">s(q) &lt; τ_lo</text>
  <line x1="1400" y1="665" x2="1450" y2="665" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1460" y="640" width="260" height="55" rx="6" fill="#fff" stroke="#2E7D32"/>
  <text x="1590" y="663" text-anchor="middle" class="small" font-weight="700">Output: 1-intent set</text>
  <text x="1590" y="685" text-anchor="middle" class="small">Downstream routing</text>

  <!-- CLARIFY -->
  <rect x="1235" y="725" width="510" height="90" rx="10" fill="#FFF8E1" stroke="#E08E0B" stroke-width="1.5"/>
  <text x="1260" y="760" class="body" fill="#B8700A" font-weight="700">CLARIFY</text>
  <text x="1260" y="790" class="small">τ_lo ≤ s(q) ≤ τ_hi</text>
  <line x1="1400" y1="770" x2="1450" y2="770" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1460" y="745" width="260" height="55" rx="6" fill="#fff" stroke="#E08E0B"/>
  <text x="1590" y="768" text-anchor="middle" class="small" font-weight="700">Output: 2–3 intents</text>
  <text x="1590" y="790" text-anchor="middle" class="small">User confirmation</text>

  <!-- REJECT -->
  <rect x="1235" y="830" width="510" height="90" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/>
  <text x="1260" y="865" class="body" fill="#C0392B" font-weight="700">REJECT</text>
  <text x="1260" y="895" class="small">s(q) &gt; τ_hi</text>
  <line x1="1400" y1="875" x2="1450" y2="875" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1460" y="850" width="260" height="55" rx="6" fill="#fff" stroke="#C0392B"/>
  <text x="1590" y="873" text-anchor="middle" class="small" font-weight="700">Output: empty set</text>
  <text x="1590" y="895" text-anchor="middle" class="small">Human escalation</text>

  <!-- inter-module arrows -->
  <line x1="590" y1="680" x2="610" y2="680" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1190" y1="680" x2="1210" y2="680" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ BOTTOM: OPTIONAL COMPARISON ============ -->
  <rect x="30" y="960" width="1740" height="130" rx="14" fill="#F4F6F9" stroke="#888" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="55" y="995" class="hdr" fill="#444">OPTIONAL COMPARISON (Not Required)</text>

  <!-- left: light finetuning -->
  <rect x="60" y="1015" width="700" height="60" rx="10" fill="#fff" stroke="#888"/>
  <text x="100" y="1055" class="body" font-weight="700">Light Fine-Tuning (LoRA / SetFit)</text>
  <rect x="500" y="1025" width="150" height="40" rx="6" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
  <text x="575" y="1052" text-anchor="middle" class="body" fill="#C0392B" font-weight="700">NOT Required</text>

  <line x1="780" y1="1045" x2="900" y2="1045" stroke="#888" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- right: our method -->
  <rect x="920" y="1015" width="830" height="60" rx="10" fill="#fff" stroke="#3D8B5E" stroke-width="1.5"/>
  <text x="960" y="1045" class="body" font-weight="700">Retrieval + Calibration + Decision Only</text>
  <text x="960" y="1068" class="small">with Theoretical Guarantees</text>
  <circle cx="1700" cy="1045" r="22" fill="#E08E0B"/>
  <text x="1700" y="1052" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">★</text>

  <!-- footer note -->
  <text x="900" y="1130" text-anchor="middle" class="small" fill="#666">
    Finite-sample coverage guarantee:  P(Y ∈ Ŝ(q)) ≥ 1 − α  under exchangeability · No gradient updates · Black-box LLM compatible
  </text>
</svg>
